server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: demo-backend
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

logging:
  level:
    root: INFO
    com.example.gateway: INFO